<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reagent - Interactive Smart Contract Development</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --primary: #667eea;
            --primary-dark: #764ba2;
            --success: #2ecc71;
            --warning: #f39c12;
            --danger: #e74c3c;
            --info: #3498db;
            --bg: #f8f9fa;
            --text: #333;
            --border: #e0e0e0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            min-height: 100vh;
            padding: 20px;
            color: var(--text);
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 { font-size: 1.8em; }
        .header p { opacity: 0.9; font-size: 0.95em; }

        .server-config {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .server-config input {
            padding: 6px 12px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 6px;
            background: rgba(255,255,255,0.15);
            color: white;
            font-size: 13px;
            width: 200px;
        }

        .server-config input::placeholder { color: rgba(255,255,255,0.6); }
        .server-config input:focus { outline: none; border-color: white; }

        .main {
            display: grid;
            grid-template-columns: 380px 1fr;
            gap: 0;
            min-height: calc(100vh - 140px);
        }

        .sidebar {
            background: var(--bg);
            border-right: 1px solid var(--border);
            padding: 20px;
            overflow-y: auto;
            max-height: calc(100vh - 140px);
        }

        .sidebar h2 {
            color: var(--primary);
            margin-bottom: 15px;
            font-size: 1.2em;
        }

        .content-area {
            display: grid;
            grid-template-rows: auto 1fr auto;
            gap: 0;
        }

        .stage-bar {
            display: flex;
            padding: 12px 20px;
            background: white;
            border-bottom: 1px solid var(--border);
            gap: 6px;
        }

        .stage {
            flex: 1;
            text-align: center;
            padding: 8px 4px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
            color: #999;
            background: #f0f0f0;
            position: relative;
        }

        .stage.active { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: white; }
        .stage.completed { background: var(--success); color: white; }
        .stage.failed { background: var(--danger); color: white; }
        .stage::after {
            content: '';
            position: absolute;
            right: -8px;
            top: 50%;
            transform: translateY(-50%);
            width: 0; height: 0;
            border-top: 6px solid transparent;
            border-bottom: 6px solid transparent;
            border-left: 6px solid #f0f0f0;
        }
        .stage:last-child::after { display: none; }
        .stage.active::after { border-left-color: var(--primary-dark); }
        .stage.completed::after { border-left-color: var(--success); }

        .progress-bar-container {
            padding: 0 20px;
            background: white;
        }

        .progress-bar {
            height: 3px;
            background: #e0e0e0;
            border-radius: 2px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--primary-dark));
            width: 0%;
            transition: width 0.5s ease;
        }

        .content-grid {
            display: grid;
            grid-template-columns: 1fr 350px;
            gap: 0;
            overflow: hidden;
        }

        .output-panel {
            padding: 15px 20px;
            overflow-y: auto;
            border-right: 1px solid var(--border);
        }

        .output-panel h3 {
            font-size: 1em;
            margin-bottom: 10px;
            color: var(--primary);
        }

        .output-content {
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 12px;
            border-radius: 6px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            line-height: 1.5;
            overflow-x: auto;
            white-space: pre-wrap;
            word-break: break-all;
            max-height: 400px;
            overflow-y: auto;
            position: relative;
        }

        .output-content .copy-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: #d4d4d4;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
        }

        .output-content .copy-btn:hover { background: rgba(255,255,255,0.2); }

        .log-panel {
            padding: 15px 20px;
            display: flex;
            flex-direction: column;
        }

        .log-panel h3 { font-size: 1em; margin-bottom: 10px; color: var(--primary); }

        .log-filters {
            display: flex;
            gap: 4px;
            margin-bottom: 8px;
            flex-wrap: wrap;
        }

        .log-filter-btn {
            padding: 3px 8px;
            border: 1px solid var(--border);
            border-radius: 4px;
            background: white;
            font-size: 11px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .log-filter-btn.active { background: var(--primary); color: white; border-color: var(--primary); }

        .log {
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 12px;
            border-radius: 6px;
            flex: 1;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            line-height: 1.5;
            min-height: 200px;
            max-height: 400px;
        }

        .log-entry { margin-bottom: 4px; padding: 3px 6px; border-left: 3px solid transparent; }
        .log-entry.info { border-left-color: var(--info); }
        .log-entry.success { border-left-color: var(--success); }
        .log-entry.error { border-left-color: var(--danger); }
        .log-entry.question { border-left-color: var(--warning); background: rgba(243, 156, 18, 0.1); }
        .log-entry[data-type] { border-left-color: var(--info); }

        .log-timestamp { color: #888; font-size: 10px; }

        .input-group { margin-bottom: 12px; }
        .input-group label { display: block; margin-bottom: 4px; font-weight: 600; font-size: 13px; }

        .input-group input,
        .input-group textarea,
        .input-group select {
            width: 100%;
            padding: 10px;
            border: 2px solid var(--border);
            border-radius: 6px;
            font-size: 13px;
            transition: border-color 0.3s;
        }

        .input-group input:focus,
        .input-group textarea:focus,
        .input-group select:focus { outline: none; border-color: var(--primary); }
        .input-group textarea { resize: vertical; min-height: 80px; font-family: inherit; }

        .btn {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            width: 100%;
        }

        .btn:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .btn-danger { background: var(--danger); }
        .btn-danger:hover:not(:disabled) { box-shadow: 0 4px 12px rgba(231, 76, 60, 0.4); }

        .btn-sm { padding: 6px 12px; font-size: 12px; width: auto; }

        .status {
            padding: 10px;
            border-radius: 6px;
            margin: 12px 0;
            font-size: 13px;
            font-weight: 600;
        }

        .status.connected { background: #d4edda; color: #155724; }
        .status.disconnected { background: #f8d7da; color: #721c24; }
        .status.working { background: #fff3cd; color: #856404; }
        .status.reconnecting { background: #cce5ff; color: #004085; animation: pulse 1.5s infinite; }

        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }

        .question-box {
            background: #fff3cd;
            border: 2px solid var(--warning);
            border-radius: 6px;
            padding: 12px;
            margin: 12px 0;
            display: none;
        }

        .question-box.active { display: block; animation: slideIn 0.3s ease; }
        @keyframes slideIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

        .question-box h3 { color: #856404; margin-bottom: 8px; font-size: 14px; }
        .question-box .context { color: #666; font-size: 12px; margin-bottom: 8px; }

        .question-options { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }

        .question-options button {
            background: white;
            border: 2px solid var(--warning);
            color: #856404;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            font-size: 12px;
            transition: all 0.2s;
        }

        .question-options button:hover { background: var(--warning); color: white; }

        .inject-box {
            background: #e7f5ff;
            border: 2px solid var(--info);
            border-radius: 6px;
            padding: 12px;
            margin: 12px 0;
        }

        .inject-box h3 { color: #004085; margin-bottom: 8px; font-size: 14px; }

        .no-output {
            color: #888;
            font-style: italic;
            padding: 20px;
            text-align: center;
        }

        .output-tabs {
            display: flex;
            gap: 4px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }

        .output-tab {
            padding: 4px 10px;
            border: 1px solid var(--border);
            border-radius: 4px;
            background: white;
            font-size: 11px;
            cursor: pointer;
        }

        .output-tab.active { background: var(--primary); color: white; border-color: var(--primary); }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div>
                <h1>Reagent</h1>
                <p>Interactive Smart Contract Development Agent</p>
            </div>
            <div class="server-config">
                <input type="text" id="serverUrl" placeholder="ws://localhost:8001" value="">
            </div>
        </div>

        <div class="main">
            <div class="sidebar">
                <h2>Start Workflow</h2>

                <div class="input-group">
                    <label for="workflowId">Workflow ID</label>
                    <input type="text" id="workflowId" placeholder="workflow_123">
                </div>

                <div class="input-group">
                    <label for="requirements">Requirements</label>
                    <textarea id="requirements" placeholder="Describe your smart contract...">Build an ERC-20 token for a DeFi project with burn and pause features</textarea>
                </div>

                <div class="input-group">
                    <label for="mode">Mode</label>
                    <select id="mode">
                        <option value="orchestrate">Orchestrate (Full Pipeline)</option>
                        <option value="plan">Plan (Analysis Only)</option>
                        <option value="code">Code (Direct Generation)</option>
                    </select>
                </div>

                <button class="btn" id="connectBtn" onclick="connect()">Connect & Start</button>
                <button class="btn btn-danger" id="disconnectBtn" onclick="disconnect()" style="display:none;">Disconnect</button>

                <div id="status" class="status disconnected">Disconnected</div>

                <div class="question-box" id="questionBox">
                    <h3 id="questionText"></h3>
                    <div class="context" id="questionContext"></div>
                    <div class="input-group">
                        <input type="text" id="answerInput" placeholder="Type your answer...">
                    </div>
                    <div class="question-options" id="questionOptions"></div>
                    <button class="btn btn-sm" onclick="submitAnswer()">Submit Answer</button>
                </div>

                <div class="inject-box">
                    <h3>Inject Context</h3>
                    <div class="input-group" style="margin-bottom: 6px;">
                        <input type="text" id="injectInput" placeholder="Mid-workflow suggestion...">
                    </div>
                    <button class="btn btn-sm" onclick="injectContext()" style="background: var(--info);">Inject</button>
                </div>
            </div>

            <div class="content-area">
                <div class="stage-bar" id="stageIndicator" style="display:none;">
                    <div class="stage" data-stage="ideation">Ideation</div>
                    <div class="stage" data-stage="coding">Coding</div>
                    <div class="stage" data-stage="testing">Testing</div>
                    <div class="stage" data-stage="auditing">Auditing</div>
                    <div class="stage" data-stage="deployment">Deployment</div>
                    <div class="stage" data-stage="monitoring">Monitoring</div>
                </div>
                <div class="progress-bar-container">
                    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
                </div>
                <div class="content-grid">
                    <div class="output-panel">
                        <h3>Output</h3>
                        <div class="output-tabs" id="outputTabs"></div>
                        <div id="outputArea">
                            <div class="no-output">No output yet. Start a workflow to see results.</div>
                        </div>
                    </div>
                    <div class="log-panel">
                        <h3>Event Log</h3>
                        <div class="log-filters">
                            <button class="log-filter-btn active" data-filter="all" onclick="setLogFilter('all')">All</button>
                            <button class="log-filter-btn" data-filter="question" onclick="setLogFilter('question')">Questions</button>
                            <button class="log-filter-btn" data-filter="error" onclick="setLogFilter('error')">Errors</button>
                            <button class="log-filter-btn" data-filter="success" onclick="setLogFilter('success')">Success</button>
                        </div>
                        <div class="log" id="log"></div>
                        <button class="btn btn-sm" onclick="clearLog()" style="margin-top: 8px; background: #6c757d;">Clear Log</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let ws = null;
        let currentQuestion = null;
        let reconnectAttempts = 0;
        let reconnectTimer = null;
        let currentLogFilter = 'all';
        let workflowOutputs = {};
        let currentOutputTab = null;

        // Auto-detect server URL
        (function detectServerUrl() {
            const input = document.getElementById('serverUrl');
            const proto = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const host = window.location.host || 'localhost:8001';
            input.value = `${proto}//${host}`;
        })();

        function log(message, type = 'info') {
            const logEl = document.getElementById('log');
            const timestamp = new Date().toLocaleTimeString();
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            entry.setAttribute('data-type', type);
            entry.innerHTML = `<span class="log-timestamp">[${timestamp}]</span> ${message}`;
            logEl.appendChild(entry);
            logEl.scrollTop = logEl.scrollHeight;
        }

        function setLogFilter(filter) {
            currentLogFilter = filter;
            document.querySelectorAll('.log-filter-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.filter === filter);
            });
            document.querySelectorAll('.log-entry').forEach(entry => {
                if (filter === 'all') {
                    entry.style.display = '';
                } else {
                    entry.style.display = entry.classList.contains(filter) ? '' : 'none';
                }
            });
        }

        function updateStatus(text, className) {
            const statusEl = document.getElementById('status');
            statusEl.textContent = text;
            statusEl.className = `status ${className}`;
        }

        function updateStage(stage, status = 'active') {
            const stageEl = document.querySelector(`[data-stage="${stage}"]`);
            if (stageEl) stageEl.className = `stage ${status}`;
        }

        function updateProgress(pct) {
            document.getElementById('progressFill').style.width = `${pct}%`;
        }

        function showQuestion(question) {
            currentQuestion = question;
            const qBox = document.getElementById('questionBox');
            const qText = document.getElementById('questionText');
            const qCtx = document.getElementById('questionContext');
            const aInput = document.getElementById('answerInput');
            const qOpts = document.getElementById('questionOptions');

            qText.textContent = question.data.question;
            qCtx.textContent = question.data.context || '';
            qCtx.style.display = question.data.context ? 'block' : 'none';
            aInput.value = '';
            qOpts.innerHTML = '';

            if (question.data.options && question.data.options.length > 0) {
                aInput.style.display = 'none';
                question.data.options.forEach(option => {
                    const btn = document.createElement('button');
                    btn.textContent = option;
                    btn.onclick = () => submitAnswer(option);
                    qOpts.appendChild(btn);
                });
            } else {
                aInput.style.display = 'block';
            }

            qBox.classList.add('active');
            log(`Question: ${question.data.question}`, 'question');
        }

        function hideQuestion() {
            document.getElementById('questionBox').classList.remove('active');
            currentQuestion = null;
        }

        function submitAnswer(answer = null) {
            if (!currentQuestion) return;
            const answerValue = answer || document.getElementById('answerInput').value;
            if (!answerValue) { alert('Please provide an answer'); return; }

            ws.send(JSON.stringify({
                type: 'answer',
                workflow_id: currentQuestion.workflow_id,
                question_id: currentQuestion.data.question_id,
                answer: answerValue
            }));

            log(`Answered: ${answerValue}`, 'success');
            hideQuestion();
        }

        function injectContext() {
            const suggestion = document.getElementById('injectInput').value.trim();
            if (!suggestion) { alert('Please enter a suggestion'); return; }
            if (!ws || ws.readyState !== WebSocket.OPEN) { alert('Not connected'); return; }

            const workflowId = document.getElementById('workflowId').value;
            ws.send(JSON.stringify({
                type: 'inject_context',
                workflow_id: workflowId,
                suggestion: suggestion
            }));

            log(`Injected: ${suggestion}`, 'info');
            document.getElementById('injectInput').value = '';
        }

        function connect() {
            const serverUrl = document.getElementById('serverUrl').value.replace(/\/+$/, '');
            const workflowId = document.getElementById('workflowId').value;
            const requirements = document.getElementById('requirements').value;
            const mode = document.getElementById('mode').value;

            if (!workflowId || !requirements) { alert('Please fill in all fields'); return; }

            const wsUrl = `${serverUrl}/ws/${workflowId}`;
            log(`Connecting to ${wsUrl}...`, 'info');

            ws = new WebSocket(wsUrl);

            ws.onopen = () => {
                reconnectAttempts = 0;
                log('Connected to Reagent', 'success');
                updateStatus('Connected', 'connected');
                document.getElementById('connectBtn').style.display = 'none';
                document.getElementById('disconnectBtn').style.display = 'inline-block';
                document.getElementById('stageIndicator').style.display = 'flex';

                ws.send(JSON.stringify({
                    type: 'start_workflow',
                    workflow_id: workflowId,
                    requirements: requirements,
                    mode: mode
                }));

                log(`Starting ${mode} workflow...`, 'info');
            };

            ws.onmessage = (event) => handleMessage(JSON.parse(event.data));

            ws.onerror = () => {
                log('WebSocket error', 'error');
            };

            ws.onclose = () => {
                log('Disconnected', 'info');
                ws = null;
                document.getElementById('connectBtn').style.display = 'inline-block';
                document.getElementById('disconnectBtn').style.display = 'none';

                // Auto-reconnect with exponential backoff
                if (reconnectAttempts < 5) {
                    reconnectAttempts++;
                    const delay = Math.min(1000 * Math.pow(2, reconnectAttempts - 1), 10000);
                    updateStatus(`Reconnecting in ${delay/1000}s... (attempt ${reconnectAttempts})`, 'reconnecting');
                    log(`Auto-reconnect attempt ${reconnectAttempts} in ${delay}ms`, 'info');
                    reconnectTimer = setTimeout(() => connect(), delay);
                } else {
                    updateStatus('Disconnected (max reconnects reached)', 'disconnected');
                }
            };
        }

        function disconnect() {
            if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
            reconnectAttempts = 99; // prevent auto-reconnect
            if (ws) {
                ws.send(JSON.stringify({
                    type: 'abort',
                    workflow_id: document.getElementById('workflowId').value,
                    reason: 'User disconnected'
                }));
                ws.close();
            }
        }

        function handleMessage(message) {
            switch (message.type) {
                case 'connected':
                    log('WebSocket connection established', 'success');
                    break;
                case 'workflow_started':
                    log('Workflow started', 'success');
                    updateStatus('Working...', 'working');
                    updateProgress(5);
                    break;
                case 'stage.started':
                    log(`Stage started: ${message.stage}`, 'info');
                    updateStage(message.stage, 'active');
                    updateProgress(getStageProgress(message.stage));
                    break;
                case 'stage.progress':
                    const pct = message.data.progress || 0;
                    log(`Progress: ${pct}% - ${message.message}`, 'info');
                    updateProgress(getStageProgress(message.stage) + (pct / 20));
                    break;
                case 'stage.complete':
                    log(`Stage completed: ${message.stage}`, 'success');
                    updateStage(message.stage, 'completed');
                    updateProgress(getStageProgress(message.stage) + 15);
                    break;
                case 'stage.error':
                    log(`Stage error: ${message.stage} - ${message.message}`, 'error');
                    updateStage(message.stage, 'failed');
                    break;
                case 'question.asked':
                    showQuestion(message);
                    break;
                case 'answer.received':
                    log('Answer received', 'success');
                    break;
                case 'feedback.loop':
                    log(`Feedback loop: ${message.data.from} -> ${message.data.to}`, 'info');
                    break;
                case 'workflow.complete':
                    log('Workflow completed successfully!', 'success');
                    updateStatus('Completed', 'connected');
                    updateProgress(100);
                    break;
                case 'workflow.failed':
                    log(`Workflow failed: ${message.message}`, 'error');
                    updateStatus('Failed', 'disconnected');
                    break;
                case 'error':
                    log(`Error: ${message.message}`, 'error');
                    break;
                case 'pong':
                    break;
                default:
                    log(`${message.type}: ${message.message || JSON.stringify(message).substring(0, 100)}`, 'info');
            }

            // Store outputs from stage results
            if (message.data && message.data.output) {
                storeOutput(message.stage || message.type, message.data.output);
            }
        }

        function getStageProgress(stage) {
            const stages = ['ideation', 'coding', 'testing', 'auditing', 'deployment', 'monitoring'];
            const idx = stages.indexOf(stage);
            if (idx === -1) return 0;
            return ((idx) / stages.length) * 85;
        }

        function storeOutput(stage, output) {
            workflowOutputs[stage] = output;
            renderOutputTabs();
        }

        function renderOutputTabs() {
            const tabsEl = document.getElementById('outputTabs');
            tabsEl.innerHTML = '';
            Object.keys(workflowOutputs).forEach(stage => {
                const tab = document.createElement('button');
                tab.className = `output-tab ${stage === currentOutputTab ? 'active' : ''}`;
                tab.textContent = stage;
                tab.onclick = () => showOutput(stage);
                tabsEl.appendChild(tab);
            });
            if (!currentOutputTab && Object.keys(workflowOutputs).length > 0) {
                showOutput(Object.keys(workflowOutputs)[0]);
            }
        }

        function showOutput(stage) {
            currentOutputTab = stage;
            renderOutputTabs();
            const output = workflowOutputs[stage];
            const area = document.getElementById('outputArea');

            // Pretty-print the output
            let display = '';
            if (output.solidity_code) {
                display = output.solidity_code;
            } else if (output.test_code) {
                display = output.test_code;
            } else if (output.requirements_analysis) {
                display = JSON.stringify(output, null, 2);
            } else {
                display = JSON.stringify(output, null, 2);
            }

            area.innerHTML = `<div class="output-content"><button class="copy-btn" onclick="copyOutput()">Copy</button>${escapeHtml(display)}</div>`;
        }

        function copyOutput() {
            const output = workflowOutputs[currentOutputTab];
            let text = '';
            if (output.solidity_code) text = output.solidity_code;
            else if (output.test_code) text = output.test_code;
            else text = JSON.stringify(output, null, 2);

            navigator.clipboard.writeText(text).then(() => {
                log('Output copied to clipboard', 'success');
            });
        }

        function escapeHtml(str) {
            return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        function clearLog() {
            document.getElementById('log').innerHTML = '';
        }

        // Enter key submits answer
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('answerInput').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') submitAnswer();
            });
            document.getElementById('injectInput').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') injectContext();
            });
        });

        // Heartbeat
        setInterval(() => {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'ping' }));
            }
        }, 30000);
    </script>
</body>
</html>
