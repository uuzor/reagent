<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reagent - Interactive Smart Contract Development</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }
        
        .main {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            padding: 30px;
        }
        
        .panel {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 20px;
        }
        
        .panel h2 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 1.5em;
        }
        
        .input-group {
            margin-bottom: 15px;
        }
        
        .input-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #333;
        }
        
        .input-group input,
        .input-group textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        
        .input-group input:focus,
        .input-group textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .input-group textarea {
            resize: vertical;
            min-height: 100px;
            font-family: inherit;
        }
        
        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        .btn:active {
            transform: translateY(0);
        }
        
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        
        .status {
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 15px;
            font-weight: 600;
        }
        
        .status.connected {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .status.disconnected {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .status.working {
            background: #fff3cd;
            color: #856404;
            border: 1px solid #ffeaa7;
        }
        
        .log {
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 15px;
            border-radius: 6px;
            height: 400px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            line-height: 1.6;
        }
        
        .log-entry {
            margin-bottom: 8px;
            padding: 5px;
            border-left: 3px solid transparent;
        }
        
        .log-entry.info {
            border-left-color: #3498db;
        }
        
        .log-entry.success {
            border-left-color: #2ecc71;
        }
        
        .log-entry.error {
            border-left-color: #e74c3c;
        }
        
        .log-entry.question {
            border-left-color: #f39c12;
            background: rgba(243, 156, 18, 0.1);
        }
        
        .log-timestamp {
            color: #888;
            font-size: 11px;
        }
        
        .question-box {
            background: #fff3cd;
            border: 2px solid #ffc107;
            border-radius: 6px;
            padding: 15px;
            margin-top: 15px;
            display: none;
        }
        
        .question-box.active {
            display: block;
        }
        
        .question-box h3 {
            color: #856404;
            margin-bottom: 10px;
        }
        
        .question-options {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 10px;
        }
        
        .question-options button {
            background: white;
            border: 2px solid #ffc107;
            color: #856404;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }
        
        .question-options button:hover {
            background: #ffc107;
            color: white;
        }
        
        .progress-bar {
            width: 100%;
            height: 8px;
            background: #e0e0e0;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 10px;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            width: 0%;
            transition: width 0.3s;
        }
        
        .stage-indicator {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            padding: 10px;
            background: white;
            border-radius: 6px;
        }
        
        .stage {
            flex: 1;
            text-align: center;
            padding: 10px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
            color: #999;
            background: #f0f0f0;
            margin: 0 5px;
        }
        
        .stage.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .stage.completed {
            background: #2ecc71;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🧪 Reagent</h1>
            <p>Interactive Smart Contract Development Agent</p>
        </div>
        
        <div class="main">
            <div class="panel">
                <h2>Start Workflow</h2>
                
                <div class="input-group">
                    <label for="workflowId">Workflow ID</label>
                    <input type="text" id="workflowId" placeholder="workflow_123" value="workflow_demo">
                </div>
                
                <div class="input-group">
                    <label for="requirements">Requirements</label>
                    <textarea id="requirements" placeholder="Describe your smart contract...">Build an ERC-20 token for a DeFi project with burn and pause features</textarea>
                </div>
                
                <div class="input-group">
                    <label for="mode">Mode</label>
                    <select id="mode" style="width: 100%; padding: 12px; border: 2px solid #e0e0e0; border-radius: 6px;">
                        <option value="orchestrate">Orchestrate (Full Pipeline)</option>
                        <option value="plan">Plan (Analysis Only)</option>
                        <option value="code">Code (Direct Generation)</option>
                    </select>
                </div>
                
                <button class="btn" id="connectBtn" onclick="connect()">Connect & Start</button>
                <button class="btn" id="disconnectBtn" onclick="disconnect()" style="display:none; background: #e74c3c;">Disconnect</button>
                
                <div id="status" class="status disconnected" style="margin-top: 15px;">
                    🔴 Disconnected
                </div>
                
                <div class="stage-indicator" id="stageIndicator" style="display:none;">
                    <div class="stage" data-stage="ideation">Ideation</div>
                    <div class="stage" data-stage="coding">Coding</div>
                    <div class="stage" data-stage="testing">Testing</div>
                    <div class="stage" data-stage="auditing">Auditing</div>
                    <div class="stage" data-stage="deployment">Deployment</div>
                    <div class="stage" data-stage="monitoring">Monitoring</div>
                </div>
                
                <div class="question-box" id="questionBox">
                    <h3 id="questionText"></h3>
                    <div class="input-group">
                        <input type="text" id="answerInput" placeholder="Type your answer...">
                    </div>
                    <div class="question-options" id="questionOptions"></div>
                    <button class="btn" onclick="submitAnswer()" style="margin-top: 10px;">Submit Answer</button>
                </div>
            </div>
            
            <div class="panel">
                <h2>Event Log</h2>
                <div class="log" id="log"></div>
                <button class="btn" onclick="clearLog()" style="margin-top: 10px; background: #6c757d;">Clear Log</button>
            </div>
        </div>
    </div>
    
    <script>
        let ws = null;
        let currentQuestion = null;
        
        function log(message, type = 'info') {
            const logEl = document.getElementById('log');
            const timestamp = new Date().toLocaleTimeString();
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            entry.innerHTML = `<span class="log-timestamp">[${timestamp}]</span> ${message}`;
            logEl.appendChild(entry);
            logEl.scrollTop = logEl.scrollHeight;
        }
        
        function updateStatus(text, className) {
            const statusEl = document.getElementById('status');
            statusEl.textContent = text;
            statusEl.className = `status ${className}`;
        }
        
        function updateStage(stage, status = 'active') {
            const stageEl = document.querySelector(`[data-stage="${stage}"]`);
            if (stageEl) {
                stageEl.className = `stage ${status}`;
            }
        }
        
        function showQuestion(question) {
            currentQuestion = question;
            const questionBox = document.getElementById('questionBox');
            const questionText = document.getElementById('questionText');
            const answerInput = document.getElementById('answerInput');
            const questionOptions = document.getElementById('questionOptions');
            
            questionText.textContent = question.data.question;
            answerInput.value = '';
            questionOptions.innerHTML = '';
            
            if (question.data.options && question.data.options.length > 0) {
                answerInput.style.display = 'none';
                question.data.options.forEach(option => {
                    const btn = document.createElement('button');
                    btn.textContent = option;
                    btn.onclick = () => submitAnswer(option);
                    questionOptions.appendChild(btn);
                });
            } else {
                answerInput.style.display = 'block';
            }
            
            questionBox.classList.add('active');
            log(`❓ Question: ${question.data.question}`, 'question');
        }
        
        function hideQuestion() {
            document.getElementById('questionBox').classList.remove('active');
            currentQuestion = null;
        }
        
        function submitAnswer(answer = null) {
            if (!currentQuestion) return;
            
            const answerValue = answer || document.getElementById('answerInput').value;
            if (!answerValue) {
                alert('Please provide an answer');
                return;
            }
            
            ws.send(JSON.stringify({
                type: 'answer',
                workflow_id: currentQuestion.workflow_id,
                question_id: currentQuestion.data.question_id,
                answer: answerValue
            }));
            
            log(`✅ Answered: ${answerValue}`, 'success');
            hideQuestion();
        }
        
        function connect() {
            const workflowId = document.getElementById('workflowId').value;
            const requirements = document.getElementById('requirements').value;
            const mode = document.getElementById('mode').value;
            
            if (!workflowId || !requirements) {
                alert('Please fill in all fields');
                return;
            }
            
            const wsUrl = `ws://localhost:8001/ws/${workflowId}`;
            log(`🔌 Connecting to ${wsUrl}...`, 'info');
            
            ws = new WebSocket(wsUrl);
            
            ws.onopen = () => {
                log('✅ Connected to Reagent', 'success');
                updateStatus('🟢 Connected', 'connected');
                document.getElementById('connectBtn').style.display = 'none';
                document.getElementById('disconnectBtn').style.display = 'inline-block';
                document.getElementById('stageIndicator').style.display = 'flex';
                
                // Start workflow
                ws.send(JSON.stringify({
                    type: 'start_workflow',
                    workflow_id: workflowId,
                    requirements: requirements,
                    mode: mode
                }));
                
                log(`🚀 Starting ${mode} workflow...`, 'info');
            };
            
            ws.onmessage = (event) => {
                const message = JSON.parse(event.data);
                handleMessage(message);
            };
            
            ws.onerror = (error) => {
                log(`❌ WebSocket error: ${error}`, 'error');
                updateStatus('🔴 Error', 'disconnected');
            };
            
            ws.onclose = () => {
                log('🔌 Disconnected from Reagent', 'info');
                updateStatus('🔴 Disconnected', 'disconnected');
                document.getElementById('connectBtn').style.display = 'inline-block';
                document.getElementById('disconnectBtn').style.display = 'none';
                document.getElementById('stageIndicator').style.display = 'none';
                ws = null;
            };
        }
        
        function disconnect() {
            if (ws) {
                ws.send(JSON.stringify({
                    type: 'abort',
                    workflow_id: document.getElementById('workflowId').value,
                    reason: 'User disconnected'
                }));
                ws.close();
            }
        }
        
        function handleMessage(message) {
            switch (message.type) {
                case 'connected':
                    log('✅ WebSocket connection established', 'success');
                    break;
                    
                case 'workflow_started':
                    log('🚀 Workflow started', 'success');
                    updateStatus('🟡 Working...', 'working');
                    break;
                    
                case 'stage.started':
                    log(`📍 Stage started: ${message.stage}`, 'info');
                    updateStage(message.stage, 'active');
                    break;
                    
                case 'stage.progress':
                    log(`⏳ Progress: ${message.data.progress}% - ${message.message}`, 'info');
                    break;
                    
                case 'stage.complete':
                    log(`✅ Stage completed: ${message.stage}`, 'success');
                    updateStage(message.stage, 'completed');
                    break;
                    
                case 'stage.error':
                    log(`❌ Stage error: ${message.stage} - ${message.message}`, 'error');
                    break;
                    
                case 'question.asked':
                    showQuestion(message);
                    break;
                    
                case 'answer.received':
                    log(`✅ Answer received`, 'success');
                    break;
                    
                case 'feedback.loop':
                    log(`🔄 Feedback loop: ${message.data.from} → ${message.data.to}`, 'info');
                    break;
                    
                case 'workflow.complete':
                    log('🎉 Workflow completed successfully!', 'success');
                    updateStatus('🟢 Completed', 'connected');
                    break;
                    
                case 'workflow.failed':
                    log(`❌ Workflow failed: ${message.message}`, 'error');
                    updateStatus('🔴 Failed', 'disconnected');
                    break;
                    
                case 'error':
                    log(`❌ Error: ${message.message}`, 'error');
                    break;
                    
                default:
                    log(`📨 ${message.type}: ${message.message || JSON.stringify(message)}`, 'info');
            }
        }
        
        function clearLog() {
            document.getElementById('log').innerHTML = '';
        }
        
        // Auto-connect on load (optional)
        // window.onload = () => connect();
    </script>
</body>
</html>
